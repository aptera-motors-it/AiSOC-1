# Alert status: through the real app and real Postgres.
#
# PATCH /api/v1/alerts/{id} stored any string as status. An unknown value was
# written, a false positive stayed in the unresolved list count, and reopening
# left resolved_at set. The suite drives the shipped ASGI app and a real
# PostgreSQL row. It skips when no database answers, which is why this job
# sets ALERT_STATUS_PROOF_REQUIRED=1: here, a skip is a failure.
#
# No `paths:` filter, for the reason alert-audit-live.yml states: a guard that
# only grades pull requests touching a named path is one the next refactor
# walks around.
name: Alert status (live)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: alert-status-live-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  alert-status-live:
    name: An unknown status is refused and resolved_at follows it
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # aisoc-db-role: owner; the suite creates a tenant, a user and an alert, which the DML-only runtime role cannot
      DATABASE_URL: postgresql+asyncpg://aisoc:aisoc_ci_only@localhost:5432/aisoc
      DATABASE_MIGRATION_URL: postgresql+asyncpg://aisoc:aisoc_ci_only@localhost:5432/aisoc
      PGPASSWORD: aisoc_ci_only
      # Not a bypass environment: the suite mints real JWTs and travels
      # through the real auth dependencies. A dev-mode principal would make
      # "the actor is the authenticated analyst" pass for the wrong reason.
      ENVIRONMENT: production
      SECRET_KEY: ci-alert-status-signing-secret-at-least-32-chars
      ALERT_STATUS_PROOF_REQUIRED: "1"
      OTEL_SDK_DISABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start PostgreSQL with registry fallback
        uses: ./.github/actions/start-postgres
        with:
          password: aisoc_ci_only

      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6
        with:
          python-version: "3.11"

      - name: Install api from its lockfile
        working-directory: services/api
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip "poetry==2.4.1"
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction
          python -m pip install --quiet pytest pytest-asyncio

      - name: Apply every migration, in order
        run: |
          for f in services/api/migrations/*.sql; do
            psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: An unknown status is refused and resolved_at follows the status
        working-directory: services/api
        run: python -m pytest tests/test_alert_status_is_known.py -v --tb=short

      # Putting the open string back must make the suite fail. Without this,
      # a skip or a test that stopped calling the route would stay green.
      - name: Accepting any string makes the status proof fail
        working-directory: services/api
        run: |
          cp app/api/v1/endpoints/alerts.py /tmp/alerts.bak
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/api/v1/endpoints/alerts.py")
          s = p.read_text()
          needle = "    status: AlertStatus | None = None\n"
          if needle not in s:
              print("negative control: AlertUpdateRequest no longer types status as AlertStatus. "
                    "The handler has been reshaped and this control no longer proves anything.")
              sys.exit(1)
          p.write_text(s.replace(needle, "    status: str | None = None\n", 1))
          PY
          if python -m pytest tests/test_alert_status_is_known.py -q >/dev/null 2>&1; then
            cp /tmp/alerts.bak app/api/v1/endpoints/alerts.py
            echo "FAIL: the status proof passed with status typed as an open string."
            exit 1
          fi
          cp /tmp/alerts.bak app/api/v1/endpoints/alerts.py
          echo "OK: an open string status makes the suite fail, as it must."
