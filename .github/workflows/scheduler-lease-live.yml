# One connector scheduler leads, against real Postgres (depth plan 4.5).
#
# Without an election two replicas each add one APScheduler job per
# connector instance, so every vendor is polled twice on every cycle. On
# a rate-limited API that is worse than duplication: the second replica's
# poll is what gets throttled, and a throttled connector looks identical
# to one whose credentials expired.
#
# The election is one conditional UPDATE, and the only way to show it
# works is two of them against one row. The decisive test interleaves the
# transactions explicitly rather than racing them, because a race between
# coroutines on one loop passes under a SELECT-then-UPDATE as well —
# measured on this repository's own lake-job claim.
name: Scheduler lease (live)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: scheduler-lease-live-${{ github.ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scheduler-lease-live:
    name: Two replicas cannot both poll every vendor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # The runtime role, not the owner. A superuser ignores every RLS
      # policy in the schema, and although scheduler_leases carries none
      # by design — it is replica coordination, not tenant data — running
      # a live suite as the superuser is how a tree acquires the habit.
      LEASE_DSN: postgresql+asyncpg://aisoc_app:aisoc_app_ci_only@localhost:5432/aisoc
      LEASE_DATABASE_MIGRATION_URL: postgresql+asyncpg://aisoc:aisoc_ci_only@localhost:5432/aisoc
      PGPASSWORD: aisoc_ci_only
      ENVIRONMENT: test
      OTEL_SDK_DISABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start PostgreSQL with registry fallback
        uses: ./.github/actions/start-postgres
        with:
          password: aisoc_ci_only

      - uses: actions/setup-python@e9d6f990972a57673cdb72ec29e19d42ba28880f # v6
        with:
          python-version: "3.11"

      - name: Install connectors from its lockfile
        working-directory: services/connectors
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip "poetry==2.4.1"
          poetry config virtualenvs.create false
          poetry install --no-root --no-interaction
          # greenlet explicitly: SQLAlchemy 2.1 moved it out of the base
          # dependency set, and without it every async engine call raises
          # a ValueError that reads as a test bug rather than a missing
          # package.
          python -m pip install --quiet pytest pytest-asyncio greenlet

      - name: Apply every migration, in order
        run: |
          set -euo pipefail
          for f in services/api/migrations/*.sql; do
            psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Give the runtime role its password
        run: |
          set -euo pipefail
          psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -c \
            "ALTER ROLE aisoc_app WITH PASSWORD 'aisoc_app_ci_only';"
          psql -h localhost -U aisoc -d aisoc -v ON_ERROR_STOP=1 -q -c \
            "GRANT USAGE ON SCHEMA public TO aisoc_app;"

      - name: The lease table exists
        run: |
          set -euo pipefail
          found=$(psql -h localhost -U aisoc -d aisoc -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name = 'scheduler_leases'")
          if [ "$found" != "1" ]; then
            echo "FAIL: migration 112 ran and created no scheduler_leases table."
            exit 1
          fi

      - name: Acquisition, renewal, takeover and release
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: python -m pytest ../../tests/isolation/test_scheduler_lease_live.py -v --tb=short

      - name: The suite actually ran
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest ../../tests/isolation/test_scheduler_lease_live.py -q 2>&1 | tee /tmp/lease-run.txt
          if grep -qE '[0-9]+ skipped' /tmp/lease-run.txt; then
            echo "FAIL: a case skipped in the job whose whole purpose is to run it live."
            exit 1
          fi
          if ! grep -qE '[0-9]+ passed' /tmp/lease-run.txt; then
            echo "FAIL: no case reported as passed."
            exit 1
          fi

      - name: Two schedulers fetch one vendor once per window
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest ../../tests/isolation/test_connector_poll_once_live.py -v --tb=short 2>&1 | tee /tmp/poll-once.txt
          if grep -qE '[0-9]+ skipped' /tmp/poll-once.txt; then
            echo "FAIL: the poll-once case skipped in the job whose whole purpose is to run it live."
            exit 1
          fi

      # The negative control.
      #
      # Remove the expiry predicate from the acquire. Postgres then has
      # nothing to re-evaluate once the row lock is released, so both
      # interleaved transactions take the lease and both replicas poll
      # every vendor. The suite must go red.
      - name: The gate fails when the acquire stops checking the expiry
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          cp app/leader_lease.py /tmp/lease.bak
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/leader_lease.py")
          s = p.read_text()
          needle = "     WHERE scheduler_leases.expires_at < now()\n"
          if needle not in s:
              print("negative control could not find the expiry predicate; the acquire has been "
                    "reshaped and this control no longer proves anything")
              sys.exit(1)
          p.write_text(s.replace(needle, "\n", 1))
          PY
          set +e
          python -m pytest \
            "../../tests/isolation/test_scheduler_lease_live.py::TestOnlyOneLeader" \
            -q >/dev/null 2>&1
          rc=$?
          set -e
          cp /tmp/lease.bak app/leader_lease.py
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: both replicas took the lease and the suite stayed green."
            exit 1
          fi
          echo "OK: without the predicate both replicas lead and the suite goes red, as it must."

      # A lock wait longer than the lease commits an expiry that is already
      # past. ``now()`` in the SET clause is the start of the transaction, so
      # the statement has to ask Postgres whether that expiry is still ahead
      # of ``clock_timestamp()``. Dropping the check lets the waiter lead.
      - name: The gate fails when acquire ignores an already-expired lease
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          cp app/leader_lease.py /tmp/lease-expiry.bak
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/leader_lease.py")
          s = p.read_text()
          start = s.find("        if not row[2]:\n")
          end = s.find("        self._term = int(row[0])\n")
          block = s[start:end] if start >= 0 and end > start else ""
          if "expired_on_acquire" not in block or "return False" not in block:
              print("negative control could not find the expired-on-acquire check; "
                    "acquire has been reshaped and this control no longer proves anything")
              sys.exit(1)
          p.write_text(s[:start] + s[end:])
          PY
          set +e
          python -m pytest \
            ../../tests/isolation/test_scheduler_lease_live.py \
            -k blocked_longer -q >/dev/null 2>&1
          rc=$?
          set -e
          cp /tmp/lease-expiry.bak app/leader_lease.py
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: an acquire that waited out its lease still led."
            exit 1
          fi
          echo "OK: without the expiry check the blocked acquire leads and the suite goes red, as it must."

      # A lock wait longer than the time left on the row uses transaction-start
      # now(). Dropping the clock check lets that renew count, and the holder
      # fetches. Stamping the new expiry from now() instead of clock_timestamp()
      # leaves the row in the past, and the other replica takes it.
      - name: The gate fails when renew ignores an already-past lease
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          ISOLATION_CONNECTOR_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          cp app/leader_lease.py /tmp/lease-renew.bak
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/leader_lease.py")
          s = p.read_text()
          needle = " or not locked[0]"
          if s.count(needle) != 1:
              print("negative control could not find the expired-on-renew check; "
                    "renew has been reshaped and this control no longer proves anything")
              sys.exit(1)
          p.write_text(s.replace(needle, "", 1))
          PY
          set +e
          python -m pytest \
            ../../tests/isolation/test_scheduler_lease_live.py::TestRenewal::test_a_renew_that_waits_out_the_remaining_lease_does_not_open_the_row \
            ../../tests/isolation/test_connector_poll_once_live.py::test_a_renew_that_waits_out_the_remaining_lease_does_not_fetch \
            -q >/dev/null 2>&1
          rc=$?
          set -e
          cp /tmp/lease-renew.bak app/leader_lease.py
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: a renew that waited out its lease still authorized a fetch."
            exit 1
          fi
          echo "OK: without the renew clock check the waited renew fetches and the suite goes red, as it must."

      - name: The gate fails when renew stamps transaction-start now()
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          cp app/leader_lease.py /tmp/lease-renew-stamp.bak
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/leader_lease.py")
          s = p.read_text()
          needle = "           expires_at = clock_timestamp() + make_interval(secs => :lease)\n"
          if s.count(needle) != 1:
              print("negative control could not find the renew expiry stamp; "
                    "renew has been reshaped and this control no longer proves anything")
              sys.exit(1)
          p.write_text(s.replace(
              needle,
              "           expires_at = now() + make_interval(secs => :lease)\n",
              1,
          ))
          PY
          set +e
          python -m pytest \
            ../../tests/isolation/test_scheduler_lease_live.py::TestRenewal::test_a_renew_that_waits_out_the_remaining_lease_does_not_open_the_row \
            -q >/dev/null 2>&1
          rc=$?
          set -e
          cp /tmp/lease-renew-stamp.bak app/leader_lease.py
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: a renew stamped from now() left the row for the other replica."
            exit 1
          fi
          echo "OK: stamping renew from now() opens the row and the suite goes red, as it must."

      # stop() returns into the lifespan, which disposes the engine. Dropping
      # the wait lets the in-flight release run after that, the write is
      # swallowed, and the other replica does not fetch.
      - name: The gate fails when stop returns before the in-flight release
        working-directory: services/connectors
        env:
          ISOLATION_LEASE_DSN: ${{ env.LEASE_DSN }}
          ISOLATION_CONNECTOR_DSN: ${{ env.LEASE_DSN }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          cp app/scheduler.py /tmp/scheduler-stop.bak
          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("app/scheduler.py")
          s = p.read_text()
          needle = "        await self._fetches_idle.wait()\n"
          if s.count(needle) != 1:
              print("negative control could not find the in-flight wait; "
                    "stop has been reshaped and this control no longer proves anything")
              sys.exit(1)
          p.write_text(s.replace(needle, "", 1))
          PY
          set +e
          python -m pytest \
            ../../tests/isolation/test_connector_poll_once_live.py::test_an_in_flight_lease_is_released_before_the_engine_closes \
            -q >/dev/null 2>&1
          rc=$?
          set -e
          cp /tmp/scheduler-stop.bak app/scheduler.py
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: stop returned before the in-flight release and the other replica still fetched."
            exit 1
          fi
          echo "OK: without the wait the in-flight release is swallowed and the suite goes red, as it must."
